# Версия Python, для которой проверяем код
target-version = "py311"

# Длина строки
line-length = 88

[lint]
# Включённые группы правил:
# E, W — стиль (аналог flake8)
# F — логические ошибки (неиспользуемые переменные, импорты)
# I — сортировка импортов (аналог isort)
# UP — modernизация синтаксиса (аналог pyupgrade)
# S — безопасность (аналог bandit)
# B — распространённые ловушки (bugbear)
select = ["E", "W", "F", "I", "UP", "S", "B"]

# Правила, которые намеренно отключаем
ignore = [
    "S101",  # Разрешаем assert в тестах
]

[lint.per-file-ignores]
# В тестах допускаем жёстко заданные значения (пароли, ключи — это фикстуры)
"tests/*" = ["S105", "S106"]

[format]
# Стиль кавычек
quote-style = "double"